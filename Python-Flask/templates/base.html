<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Zip Slip Lab{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><header class="navbar"><div class="container nav-container"><a class="brand" href="{{ url_for('upload_bundle') }}"><span class="brand-badge">ZIP</span><span>Archive Upload Lab</span></a><ul class="nav-links"><li><a class="nav-link" href="{{ url_for('upload_bundle') }}">Upload Bundle</a></li></ul></div></header><main class="main-content"><div class="container">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></main></body></html>
